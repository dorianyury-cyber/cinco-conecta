<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinco Conecta — Encuestas</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="bienvenida.html" class="brand">
        <img src="assets/img/logo.png" alt="Cinco S.A.S.">
        <span>Cinco Conecta</span>
      </a>
      <nav>
        <a href="inicio.html"><img class="nav-icono" src="assets/img/nav/inicio.jpg" alt=""> Inicio</a>

        <div class="nav-group" data-grupo="experiencia">
          <button type="button" class="nav-group-toggle">
            <span>🙌 Experiencia</span>
            <span class="nav-group-chevron">▾</span>
          </button>
          <div class="nav-group-items">
            <a href="reconocimientos.html"><img class="nav-icono" src="assets/img/nav/reconocimientos.jpg" alt=""> Reconocimientos</a>
            <a href="encuestas.html"><img class="nav-icono" src="assets/img/nav/encuestas.jpg" alt=""> Encuestas</a>
            <a href="comunicados.html"><img class="nav-icono" src="assets/img/nav/comunicados.jpg" alt=""> Comunicados</a>
          </div>
        </div>

        <div class="nav-group" data-grupo="sgi">
          <button type="button" class="nav-group-toggle">
            <span>✅ SGI-HSEQ</span>
            <span class="nav-group-chevron">▾</span>
          </button>
          <div class="nav-group-items">
            <a href="incidentes.html"><img class="nav-icono" src="assets/img/nav/incidentes.jpg" alt=""> Incidentes</a>
            <a href="acciones-correctivas.html"><img class="nav-icono" src="assets/img/nav/acciones-correctivas.jpg" alt=""> Acciones Correctivas</a>
            <a href="documentos.html"><img class="nav-icono" src="assets/img/nav/documentos.jpg" alt=""> Documentos</a>
            <a href="auditorias.html"><img class="nav-icono" src="assets/img/nav/auditorias.jpg" alt=""> Auditorías</a>
          </div>
        </div>

        <div class="nav-group" data-grupo="interventoria">
          <button type="button" class="nav-group-toggle">
            <span>📝 Interventoría</span>
            <span class="nav-group-chevron">▾</span>
          </button>
          <div class="nav-group-items">
            <a href="informes-plantillas.html"><img class="nav-icono" src="assets/img/nav/plantillas-informes.jpg" alt=""> Plantillas Informes</a>
            <a href="informes-libres.html"><img class="nav-icono" src="assets/img/nav/informes-libres.jpg" alt=""> Informes Libres</a>
          </div>
        </div>

        <div class="nav-group" data-grupo="talento">
          <button type="button" class="nav-group-toggle">
            <span>👥 Talento Humano</span>
            <span class="nav-group-chevron">▾</span>
          </button>
          <div class="nav-group-items">
            <a href="candidatos.html" data-permiso="candidatos"><img class="nav-icono" src="assets/img/nav/candidatos.jpg" alt=""> Candidatos</a>
            <a href="vacantes-admin.html" data-permiso="vacantes"><img class="nav-icono" src="assets/img/nav/vacantes.jpg" alt=""> Vacantes</a>
            <a href="empleados.html" class="solo-admin"><img class="nav-icono" src="assets/img/nav/empleados.jpg" alt=""> Empleados</a>
          </div>
        </div>
      </nav>
      <div class="spacer"></div>
      <div class="user-box">
        <div id="userName">-</div>
        <a href="cambiar-password.html" class="btn claro btn-auto mt-4">🔑 Cambiar contraseña</a>
        <button class="btn claro logout-btn" id="logoutBtn">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main">
      <header>
        <h1>📊 Encuestas</h1>
      </header>

      <div class="card solo-admin hidden" id="crearEncuestaCard">
        <button type="button" class="form-trigger">
          <span class="form-trigger-icon">📊</span>
          <span class="form-trigger-label">Nueva encuesta</span>
          <span class="form-trigger-chevron">▾</span>
        </button>
        <div class="collapsible-form"><div class="collapsible-form-inner">
        <form id="crearEncuestaForm">
          <label for="tituloEncuesta">Título</label>
          <input type="text" id="tituloEncuesta" required maxlength="150">

          <label for="preguntasEncuesta">Preguntas (una por línea, máximo 3 — se responden en escala de 1 a 5)</label>
          <textarea id="preguntasEncuesta" rows="3" required placeholder="¿Qué tan satisfecho estás con...?"></textarea>

          <div class="alert" id="crearAlertBox"></div>
          <button type="submit" class="btn" id="crearEncuestaBtn">Publicar encuesta</button>
        </form>
        </div></div>
      </div>

      <div id="encuestaActivaContenedor"></div>

      <div class="card">
        <h2>Encuestas anteriores</h2>
        <div id="historialEncuestas"><p class="text-muted">Cargando...</p></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/encuestas.js"></script>
</body>
</html>
